name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/comitato
      SESSION_SECRET: ci-session-secret-123456789012345678901234567890
      PHONE_LOOKUP_SECRET: ci-phone-secret-123456789012345678901234567890
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
